<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PhishScope{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="shell nav">
            <a class="brand" href="{{ url_for('main.dashboard') }}">
                <span class="brand-mark">PS</span>
                <span>PhishScope</span>
            </a>
            <nav>
                <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
                <a class="button small" href="{{ url_for('main.investigate') }}">New investigation</a>
            </nav>
        </div>
    </header>

    <main class="shell page">
        {% block content %}{% endblock %}
    </main>

    <footer class="shell footer">
        PhishScope · Local-first phishing triage for SOC training
    </footer>
</body>
</html>
